title: "Prompt Engineering Playbook"
description: "A practitioner-oriented reference for 20 prompt engineering techniques — with real LLM test results, honest verdicts, and documented failure modes."
baseurl: "/prompt-playbook"
url: "https://nihalshx.github.io"

# Theme
remote_theme: just-the-docs/just-the-docs
color_scheme: light

# Navigation
nav_sort: case_insensitive
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/nihalshx/prompt-playbook

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Footer
footer_content: "Built by [nihalshx](https://github.com/nihalshx). Techniques tested with the Google Gemini API."

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

# Aux links
aux_links:
  "View on GitHub":
    - "https://github.com/nihalshx/prompt-playbook"
aux_links_new_tab: true

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Heading anchor links
heading_anchors: true

# Kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Last edited timestamp
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Collections
collections:
  techniques:
    output: true
    permalink: /:collection/:name

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
